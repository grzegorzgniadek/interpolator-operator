name: Version

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, closed]

concurrency:
  group: version-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lint-title:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump:
    needs: lint-title
    # Skip closed events and fork PRs (read-only token on forks)
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # needed to see all tags and the base branch

      - name: Set VERSION from latest tag + PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # Latest semver tag already merged into the base branch
          LATEST=$(git tag --merged "origin/${BASE_REF}" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          LATEST=${LATEST:-v0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"

          if echo "$TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif echo "$TITLE" | grep -qE '^feat(\(|:)'; then
            MINOR=$((MINOR+1)); PATCH=0
          elif echo "$TITLE" | grep -qE '^fix(\(|:)'; then
            PATCH=$((PATCH+1))
          fi
          # otherwise: no release, keep the latest tag's version

          NEW="${MAJOR}.${MINOR}.${PATCH}"
          CURRENT=$(cat VERSION 2>/dev/null | tr -d '[:space:]' || true)

          echo "Latest tag: $LATEST | PR title: $TITLE | VERSION: ${CURRENT:-<none>} -> $NEW"

          if [ "$NEW" = "$CURRENT" ]; then
            echo "VERSION already $NEW, nothing to do"
            exit 0
          fi

          echo "$NEW" > VERSION
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: set version to $NEW"
          git push origin "HEAD:${HEAD_REF}"

  tag:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Tag release if new
        run: |
          set -euo pipefail

          if [ ! -f VERSION ]; then
            echo "No VERSION file, nothing to tag"
            exit 0
          fi

          TAG="v$(tr -d '[:space:]' < VERSION)"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, nothing to release"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Released $TAG"